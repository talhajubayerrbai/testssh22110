---
- name: Deploy FastAPI application
  hosts: all
  become: true
  gather_facts: true

  vars:
    app_dir: /opt/app
    venv_dir: /opt/app/.venv
    app_user: ubuntu
    service_name: fastapi-app

  tasks:
    # -------------------------------------------------------------------------
    # System packages
    # -------------------------------------------------------------------------
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required system packages
      apt:
        name:
          - python3.11
          - python3.11-venv
          - python3.11-dev
          - python3-pip
          - nginx
          - rsync
          - git
          - curl
        state: present

    # -------------------------------------------------------------------------
    # Application directory
    # -------------------------------------------------------------------------
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    # -------------------------------------------------------------------------
    # Sync application files from checked-out repo
    # -------------------------------------------------------------------------
    - name: Sync app package directory
      synchronize:
        src: "{{ playbook_dir }}/../app/"
        dest: "{{ app_dir }}/app/"
        delete: yes
        recursive: yes
        rsync_opts:
          - "--chown=ubuntu:ubuntu"

    - name: Sync requirements.txt
      synchronize:
        src: "{{ playbook_dir }}/../requirements.txt"
        dest: "{{ app_dir }}/requirements.txt"
        rsync_opts:
          - "--chown=ubuntu:ubuntu"

    - name: Sync main.py (root entrypoint)
      synchronize:
        src: "{{ playbook_dir }}/../main.py"
        dest: "{{ app_dir }}/main.py"
        rsync_opts:
          - "--chown=ubuntu:ubuntu"

    - name: Check if public/ directory exists locally
      stat:
        path: "{{ playbook_dir }}/../public"
      register: public_dir_stat
      delegate_to: localhost
      become: false

    - name: Sync public/ directory if it exists
      synchronize:
        src: "{{ playbook_dir }}/../public/"
        dest: "{{ app_dir }}/public/"
        delete: yes
        recursive: yes
        rsync_opts:
          - "--chown=ubuntu:ubuntu"
      when: public_dir_stat.stat.exists

    - name: Set ownership of app directory recursively
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        recurse: yes

    # -------------------------------------------------------------------------
    # Python virtual environment
    # -------------------------------------------------------------------------
    - name: Create Python virtual environment
      command:
        cmd: python3.11 -m venv "{{ venv_dir }}"
        creates: "{{ venv_dir }}/bin/activate"
      become_user: "{{ app_user }}"

    - name: Upgrade pip inside venv
      command:
        cmd: "{{ venv_dir }}/bin/pip install --upgrade pip"
      become_user: "{{ app_user }}"

    - name: Install Python dependencies from requirements.txt
      command:
        cmd: "{{ venv_dir }}/bin/pip install -r {{ app_dir }}/requirements.txt"
      become_user: "{{ app_user }}"

    - name: Ensure gunicorn and uvicorn are installed in venv
      command:
        cmd: "{{ venv_dir }}/bin/pip install gunicorn uvicorn[standard]"
      become_user: "{{ app_user }}"

    # -------------------------------------------------------------------------
    # Write .env file (render via shell to avoid copy module limitations)
    # -------------------------------------------------------------------------
    - name: Write .env file
      shell: |
        cat > {{ app_dir }}/.env << 'ENVEOF'
        APP_ENV=production
        PORT=8000
        HOST=0.0.0.0
        ENVEOF
        chown {{ app_user }}:{{ app_user }} {{ app_dir }}/.env
        chmod 640 {{ app_dir }}/.env

    # -------------------------------------------------------------------------
    # Systemd service
    # -------------------------------------------------------------------------
    - name: Write systemd service unit file
      copy:
        dest: /etc/systemd/system/{{ service_name }}.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=FastAPI application via Gunicorn/Uvicorn
          After=network.target

          [Service]
          Type=exec
          User={{ app_user }}
          Group={{ app_user }}
          WorkingDirectory={{ app_dir }}
          EnvironmentFile={{ app_dir }}/.env
          ExecStart={{ venv_dir }}/bin/gunicorn app.main:app \
              -k uvicorn.workers.UvicornWorker \
              -w 4 \
              -b 0.0.0.0:8000
          Restart=always
          RestartSec=5
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier={{ service_name }}

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable and start application service
      systemd:
        name: "{{ service_name }}"
        enabled: yes
        state: restarted

    # -------------------------------------------------------------------------
    # Nginx configuration
    # -------------------------------------------------------------------------
    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Write nginx site configuration
      copy:
        dest: /etc/nginx/sites-available/{{ service_name }}
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80;
              server_name _;

              access_log /var/log/nginx/{{ service_name }}_access.log;
              error_log  /var/log/nginx/{{ service_name }}_error.log;

              location / {
                  proxy_pass         http://127.0.0.1:8000;
                  proxy_http_version 1.1;
                  proxy_set_header   Host              $host;
                  proxy_set_header   X-Real-IP         $remote_addr;
                  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                  proxy_set_header   X-Forwarded-Proto $scheme;
                  proxy_set_header   Upgrade           $http_upgrade;
                  proxy_set_header   Connection        "upgrade";
                  proxy_read_timeout 120;
                  proxy_connect_timeout 120;
              }
          }

    - name: Enable nginx site
      file:
        src: /etc/nginx/sites-available/{{ service_name }}
        dest: /etc/nginx/sites-enabled/{{ service_name }}
        state: link

    - name: Test nginx configuration
      command: nginx -t
      changed_when: false

    - name: Enable and restart nginx
      systemd:
        name: nginx
        enabled: yes
        state: restarted

    # -------------------------------------------------------------------------
    # Verify service is running locally
    # -------------------------------------------------------------------------
    - name: Wait for gunicorn to bind on port 8000
      wait_for:
        host: 127.0.0.1
        port: 8000
        timeout: 60
        state: started

    - name: Local health check via nginx (port 80)
      uri:
        url: "http://127.0.0.1:80/health"
        method: GET
        status_code: 200
        timeout: 30
      register: health_result
      retries: 6
      delay: 10
      until: health_result.status == 200

    - name: Report health check result
      debug:
        msg: "Health check passed: {{ health_result.json }}"